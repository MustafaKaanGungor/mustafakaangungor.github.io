<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#050a0a" />
		<meta property="og:site_name" content="Mustafa Kaan Güngör" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Roboto:wght@300;400;500&display=swap"
			rel="stylesheet"
		/>

		<link rel="icon" href="%sveltekit.assets%/favicon.ico" type="image/x-icon" />

		<!-- Per-page title, description and Open Graph tags come from each route's <svelte:head>. -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-ink text-body antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
